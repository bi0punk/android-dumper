name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: pip install ruff mypy pytest
      - name: Ruff check
        run: ruff check .
      - name: Mypy
        run: mypy app.py
      - name: Pytest
        run: pytest